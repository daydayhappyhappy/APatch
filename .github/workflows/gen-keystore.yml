name: 生成签名密钥

# 用 GitHub 的服务器帮你生成 keystore，本地不用装 JDK。
# 跑完下载 jks 文件永久保存，并把 4 个 Secret 的值填进仓库设置。
#
# ⚠️ 安全前提：
#   1. 强烈建议先把仓库设为 Private（Settings → General → Danger Zone → Change repository visibility）
#      否则别人能从 Artifacts 下载你的私钥，也能看到运行日志
#   2. 跑完下载后，立刻删除这次运行的 Artifact 和运行记录

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'keystore 密码（留空则自动随机生成 24 位）'
        required: false
        default: ''
      key_password:
        description: '密钥密码（留空则与 keystore 密码相同）'
        required: false
        default: ''
      alias:
        description: '密钥别名'
        required: false
        default: 'apatch'
      upload_keystore:
        description: '是否上传 jks 文件供下载'
        required: false
        default: 'true'

jobs:
  genkey:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 21

      - name: 生成 keystore
        id: gen
        env:
          IN_STORE_PASS: ${{ inputs.store_password }}
          IN_KEY_PASS: ${{ inputs.key_password }}
          ALIAS: ${{ inputs.alias }}
        run: |
          set -euo pipefail
          ALIAS="${ALIAS:-apatch}"

          # 密码屏蔽，防止出现在日志里
          if [ -n "${IN_STORE_PASS}" ]; then
            STORE_PASS="$IN_STORE_PASS"
          else
            STORE_PASS="$(openssl rand -base64 32 | tr -d '/+=' | head -c 24)"
          fi
          if [ -n "${IN_KEY_PASS}" ]; then
            KEY_PASS="$IN_KEY_PASS"
          else
            KEY_PASS="$STORE_PASS"
          fi
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"

          rm -f apatch.jks
          keytool -genkeypair -v \
            -keystore apatch.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 \
            -validity 10950 \
            -alias "$ALIAS" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=APatch, OU=Custom, O=Custom, L=Unknown, ST=Unknown, C=CN" 2>&1 | tail -3

          echo "STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASS=$KEY_PASS"      >> "$GITHUB_ENV"
          echo "ALIAS=$ALIAS"            >> "$GITHUB_ENV"

      - name: 计算证书 SHA-256
        run: |
          set -euo pipefail
          keytool -exportcert -alias "$ALIAS" -keystore apatch.jks \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" -file cert.der
          DIGEST=$(sha256sum cert.der | cut -d' ' -f1)
          echo "CERT_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "证书 SHA-256：$DIGEST"
          rm -f cert.der

      - name: 输出 4 个 Secret 的值
        run: |
          set -euo pipefail
          B64=$(base64 -w 0 apatch.jks)
          {
            echo "## 请把下面 4 个值填进 Settings → Secrets and variables → Actions"
            echo
            echo '| Secret 名 | 值 |'
            echo '|---|---|'
            echo "| \`SIGNING_KEY\` | 见下方折叠块 |"
            echo "| \`KEY_STORE_PASSWORD\` | \`$STORE_PASS\` |"
            echo "| \`ALIAS\` | \`$ALIAS\` |"
            echo "| \`KEY_PASSWORD\` | \`$KEY_PASS\` |"
            echo
            echo "### SIGNING_KEY 的值（完整复制，不要有换行）"
            echo
            echo '```'
            echo "$B64"
            echo '```'
            echo
            echo "### 证书 SHA-256（编译时会写进内核，可用于核对）"
            echo
            echo '```'
            echo "$CERT_DIGEST"
            echo '```'
            echo
            echo "---"
            echo
            echo "⚠️ 下一步："
            echo "1. 下载本页面的 Artifact \`apatch-keystore\`，把 \`apatch.jks\` **永久保存**"
            echo "2. 回到这里删除 Artifact 和本次运行记录（否则他人可下载你的私钥）"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "已生成，请在页面顶部的 Summary 里查看"

      - name: 上传 keystore
        if: ${{ inputs.upload_keystore == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: apatch-keystore
          path: apatch.jks
