# 一次运行同时完成：
#   1. 用你自己的 keystore 算出签名证书的 SHA-256
#   2. 把「包名 + 证书摘要」写进 KernelPatch，编译出定制版 kpimg
#   3. （可选）把管理器包名改成任意名字
#   4. 只保留中文语言，检查更新描述改为「自动检测」
#   5. 精简语言列表：保留「跟随系统」入口，只留「中文」
#   6. 编译管理器 APK，并用 v2-only 方案重签名
#   7. 校验 APK 证书摘要与 kpimg 内写死的一致 + 校验无繁体残留 + 校验文案生效
#
# 触发方式：Actions 页 -> 本工作流 -> Run workflow

name: 编译自定义 APatch

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: '自定义管理器包名（留空则保持 me.bmax.apatch）'
        required: false
        default: ''
      keep_official_manager:
        description: '是否继续信任官方签名+官方包名（强烈建议 true，便于回退救砖）'
        required: false
        default: 'true'
      create_release:
        description: '是否顺带创建一个 GitHub Release'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取 APatch 源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 安装 Java 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: 安装 Rust 工具链
        run: |
          rustup default stable
          rustup update stable
          rustup target install aarch64-linux-android
          cargo install cargo-ndk

      - name: 读取 KernelPatch 版本号
        id: kpver
        run: |
          KP_VERSION=$(awk '/#define MAJOR/{M=$3} /#define MINOR/{m=$3} /#define PATCH/{p=$3} END{print M"."m"."p}' app/src/main/cpp/version)
          echo "KernelPatch version: $KP_VERSION"
          echo "version=$KP_VERSION" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------
      # 1. 取出签名证书的 SHA-256（这一步决定了内核信任谁）
      # ---------------------------------------------------------------
      - name: 解析密钥库并计算证书 SHA-256
        id: cert
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SIGNING_KEY:?请配置 secret: SIGNING_KEY}"
          : "${ALIAS:?请配置 secret: ALIAS}"
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/custom.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/custom.jks" >> "$GITHUB_ENV"

          keytool -exportcert \
            -alias "$ALIAS" \
            -keystore "$RUNNER_TEMP/custom.jks" \
            -storepass "$KEY_STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -file "$RUNNER_TEMP/cert.der"

          DIGEST=$(sha256sum "$RUNNER_TEMP/cert.der" | cut -d ' ' -f1)
          echo "签名证书 SHA-256: $DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "CERT_DIGEST=$DIGEST" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      # 2. 编译定制版 KernelPatch（kpimg-android）
      # ---------------------------------------------------------------
      - name: 获取 KernelPatch 与 ARM 工具链
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules \
            --branch "${{ steps.kpver.outputs.version }}" \
            https://github.com/bmax121/KernelPatch.git "$RUNNER_TEMP/kp"
          curl -sSL -o "$RUNNER_TEMP/tc.tar.xz" \
            https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -Jxf "$RUNNER_TEMP/tc.tar.xz" -C "$RUNNER_TEMP"

      - name: 写入受信任管理器（包名 + 证书摘要）
        env:
          NEW_PACKAGE: ${{ inputs.package_name || 'me.bmax.apatch' }}
          NEW_DIGEST: ${{ steps.cert.outputs.digest }}
          KEEP_OFFICIAL: ${{ inputs.keep_official_manager }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/kp/kernel/patch/android/userd.c" <<'PY'
          import os, re, sys

          path = sys.argv[1]
          pkg   = os.environ["NEW_PACKAGE"]
          digest= os.environ["NEW_DIGEST"].strip().lower()
          keep  = os.environ.get("KEEP_OFFICIAL", "true").lower() == "true"

          assert re.fullmatch(r"[0-9a-f]{64}", digest), f"digest 非法: {digest}"
          assert re.fullmatch(r"[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+", pkg), f"包名非法: {pkg}"

          def entry(name, hexdigest):
              b = [hexdigest[i:i+2] for i in range(0, 64, 2)]
              lines = []
              for i in range(0, 32, 8):
                  lines.append("            " + ", ".join("0x" + x for x in b[i:i+8]) + ",")
              lines[-1] = lines[-1].rstrip(",")
              return '    {\n        "%s",\n        {\n%s\n        }\n    }' % (name, "\n".join(lines))

          OFFICIAL_DIGEST = "d71dadc0ca07bdf594383bfb2a445134a07339f12a27044a1b326981acf5f319"

          entries = []
          if keep and pkg != "me.bmax.apatch":
              entries.append(entry("me.bmax.apatch", OFFICIAL_DIGEST))
          entries.append(entry(pkg, digest))
          entries.append('    { "", { 0 } }')

          block = ("static const struct trusted_manager_entry trusted_managers[] = {\n"
                   + ",\n".join(entries) + "\n};")

          src = open(path, encoding="utf-8").read()
          pattern = re.compile(
              r"static const struct trusted_manager_entry trusted_managers\[\] = \{.*?\n\};",
              re.S)
          if not pattern.search(src):
              sys.exit("未在 userd.c 中找到 trusted_managers 数组，KernelPatch 结构可能已变化")
          src = pattern.sub(lambda m: block, src, count=1)
          open(path, "w", encoding="utf-8").write(src)
          print("已写入 trusted_managers：")
          print(block)
          PY

      - name: 编译 kpimg（Android 版）
        run: |
          set -euo pipefail
          export TARGET_COMPILE="$RUNNER_TEMP/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-"
          cd "$RUNNER_TEMP/kp/kernel"
          export ANDROID=1
          make hdr kpimg
          mv kpimg kpimg-android
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets"
          cp kpimg-android "$GITHUB_WORKSPACE/app/src/main/assets/kpimg"
          # 把时间戳推到未来，阻止 Gradle 的 downloadKpimg 任务用官方版本覆盖掉
          touch -d "2099-01-01 00:00:00" "$GITHUB_WORKSPACE/app/src/main/assets/kpimg"
          ls -l "$GITHUB_WORKSPACE/app/src/main/assets/kpimg"

      # ---------------------------------------------------------------
      # STEP-1 中文化 + 覆盖个别文案 + 删除语言目录 + 语言过滤
      #
      # ⚠️ 执行顺序至关重要，请勿与后面的步骤对调：
      #    本步先把 values-zh-rCN/ 的官方译文合并进 values/strings.xml，
      #    再套用 OVERRIDE_ZH 覆盖个别文案，最后删除全部 values-* 目录。
      #    如果把「覆盖文案」放到本步之前，手改的文案会被官方 Weblate
      #    译文无声覆盖，且不报错 —— 所以两者已合并进同一个脚本。
      # ---------------------------------------------------------------
      - name: 'STEP-1 中文-only + 文案定制（必须最先执行）'
        run: |
          python3 - <<'PYEOF'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          """
          APatch 定制脚本 —— 一次性完成：

            1. 只保留中文：把 values-zh-rCN 的译文合并进 values/strings.xml，删除其余语言目录
            2. 覆盖个别界面文案（OVERRIDE_ZH，优先级最高）
            3. 检查更新描述改为「自动检测」
            4. build.gradle.kts 加 localeFilters（仅 zh / zh-rCN，剔除繁体与三方库多语言）

          特性：
            * 幂等 —— 重复执行不会重复插入、不会报错
            * 基于内容匹配（非行号），上游小改也不容易失效
            * 收尾自检：覆盖项、无繁体目录，任一不符直接 exit 1 让 Actions 标红
          """

          import io
          import os
          import re
          import shutil
          import sys

          RES = os.path.join("app", "src", "main", "res")
          STRINGS = os.path.join(RES, "values", "strings.xml")

          # ----------------------------------------------------------------------------
          # 小工具
          # ----------------------------------------------------------------------------

          def read(path):
              with io.open(path, encoding="utf-8") as f:
                  return f.read()


          def write(path, text):
              with io.open(path, "w", encoding="utf-8", newline="\n") as f:
                  f.write(text)


          def die(msg):
              sys.exit("\n[customize] 失败：%s\n" % msg)


          def done(msg):
              print("[customize] ✅ %s" % msg)


          def skip(msg):
              print("[customize] ⏭  %s" % msg)


          def parse_strings(text):
              """解析 strings.xml，返回 {name: value}"""
              return {m.group(1): m.group(2) for m in
                      re.finditer(r'<string[^>]*\bname="([^"]+)"[^>]*>(.*?)</string>', text, re.S)}


          # ----------------------------------------------------------------------------
          # 文案表
          # ----------------------------------------------------------------------------

          # 强制覆盖：优先级最高，无论官方译文是否存在都以此为准
          OVERRIDE_ZH = {
              # 检查更新
              "settings_check_update_summary":           "自动检测",
              # 界面文案定制
              "settings_sucompat_summary":               "适用于 su 不生效",
              "settings_selinux_hide":                   "隐藏 Selinux 改动痕迹",
              "settings_selinux_hide_summary":           "防止 Selinux 被用户进程检测到修改",
              "settings_selinux_hide_warning_non_gki":   "可能导致无法开机，请慎重使用。",
              "enable_web_debugging_summary":            "请在需要时再启用",
              "settings_night_mode_follow_sys":          "深色模式",
              "settings_night_mode_follow_sys_summary":  "跟随系统",
              "settings_use_system_color_theme":         "主题颜色",
              "settings_use_system_color_theme_summary": "跟随系统",
          }

          # 万一某条在上游被删掉，插到同名锚点后面（可选，缺失也不致命）
          INSERT_AFTER = {
              "enable_web_debugging_summary": "enable_web_debugging",
          }

          # zh-rCN 里没有翻译的条目，在此补中文（仅在官方译文缺失时生效）
          MANUAL_ZH = {
              "home_dialog_uninstall_message":
                  "仅卸载 AndroidPatch 只会移除管理器应用，并保留已修补的 boot 镜像。"
                  "卸载全部还会还原官方原版 boot 镜像，设备将失去 root，直到重新修补。",
              "reboot_download_confirm":
                  "重启进入 Download 模式？设备将进入固件刷机界面。",
              "reboot_edl_confirm":
                  "重启进入 EDL（紧急下载）模式？屏幕会保持黑屏，只能通过深度刷机工具恢复。",
          }

          # 专有名词，保持原文不做翻译
          KEEP_AS_IS = ("app_name", "about_github", "about_weblate")

          # 非语言的 values- 限定目录（深色模式 / 系统版本 / 屏幕尺寸 / 横竖屏等），不能删
          NON_LOCALE_DIR = re.compile(
              r"values-(night|notnight|v\d|sw\d|w\d|h\d|land|port|xlarge|large|normal|small|round|ldrtl|ldltr)")

          # ----------------------------------------------------------------------------
          # 1. 中文化 + 覆盖文案
          # ----------------------------------------------------------------------------

          def step_chinese_only():
              zh_path = os.path.join(RES, "values-zh-rCN", "strings.xml")

              if not os.path.isfile(STRINGS):
                  die("找不到 %s" % STRINGS)

              src = read(STRINGS)

              # ---- 用 zh-rCN 的官方译文翻译 values/strings.xml，并套用覆盖表 ----
              zh = parse_strings(read(zh_path)) if os.path.isfile(zh_path) else {}
              if zh:
                  stats = {"override": 0, "hit": 0, "manual": 0, "keep": 0, "fallback": 0}
                  fallbacks = []

                  def repl(m):
                      open_tag, name, value = m.group(1), m.group(2), m.group(3)
                      if name in OVERRIDE_ZH:          # 最高优先级
                          stats["override"] += 1
                          return open_tag + OVERRIDE_ZH[name] + "</string>"
                      if name in KEEP_AS_IS:
                          stats["keep"] += 1
                          return m.group(0)
                      if zh.get(name, "").strip():
                          stats["hit"] += 1
                          return open_tag + zh[name] + "</string>"
                      if name in MANUAL_ZH:
                          stats["manual"] += 1
                          return open_tag + MANUAL_ZH[name] + "</string>"
                      stats["fallback"] += 1
                      fallbacks.append(name)
                      return m.group(0)

                  src = re.sub(r'(<string[^>]*\bname="([^"]+)"[^>]*>)(.*?)(</string>)',
                               repl, src, flags=re.S)
                  write(STRINGS, src)
                  done("values/strings.xml 已中文化（覆盖 %d 条 / 译文 %d 条 / 补译 %d 条 / 保留专有名词 %d 条）"
                       % (stats["override"], stats["hit"], stats["manual"], stats["keep"]))
                  if fallbacks:
                      print("[customize] ⚠  以下 %d 条未找到中文，保持英文：%s"
                            % (len(fallbacks), ", ".join(fallbacks)))
              else:
                  skip("没有 values-zh-rCN，跳过中文化（仅套用覆盖文案）")

              # ---- 覆盖表里没生效的，尝试插到锚点后面 ----
              src = read(STRINGS)
              present = parse_strings(src)
              for name, value in OVERRIDE_ZH.items():
                  if name in present:
                      continue
                  anchor = INSERT_AFTER.get(name)
                  if not anchor:
                      continue
                  pat = re.compile(r'(<string name="%s">.*?</string>)' % re.escape(anchor), re.S)
                  if pat.search(src):
                      src = pat.sub(lambda m: m.group(1) +
                                    '\n    <string name="%s">%s</string>' % (name, value),
                                    src, count=1)
                      write(STRINGS, src)
                      done("缺失项已补插：%s" % name)

              # ---- 自检：所有覆盖项必须真的生效 ----
              final = parse_strings(read(STRINGS))
              bad = [n for n, v in OVERRIDE_ZH.items() if final.get(n, "").strip() != v]
              if bad:
                  die("以下文案未生效，APatch 版本可能已变化，请核对后手动改：" + ", ".join(bad))
              done("覆盖项自检通过（%d 条）" % len(OVERRIDE_ZH))

              # ---- 删掉除 values/ 之外的所有语言目录 ----
              removed = []
              for name in sorted(os.listdir(RES)):
                  d = os.path.join(RES, name)
                  if not os.path.isdir(d) or not name.startswith("values-"):
                      continue
                  if NON_LOCALE_DIR.match(name):
                      continue
                  shutil.rmtree(d)
                  removed.append(name)
              done("已删除 %d 个语言目录，只保留 values/" % len(removed))

              # ---- 自检：不得残留任何繁体目录 ----
              left = [n for n in os.listdir(RES)
                      if n.startswith("values-") and not NON_LOCALE_DIR.match(n)
                      and re.search(r"(TW|HK|MO|Hant)", n)]
              if left:
                  die("仍有繁体资源目录未删除：%s" % ", ".join(left))
              done("无繁体资源目录残留")

              # ---- unqualifiedResLocale ----
              write(os.path.join(RES, "resources.properties"), "unqualifiedResLocale=zh-rCN")
              done("resources.properties -> unqualifiedResLocale=zh-rCN")


          # ----------------------------------------------------------------------------
          # 2. build.gradle.kts 语言过滤（仅 zh / zh-rCN，不含 zh-rTW）
          # ----------------------------------------------------------------------------

          WANT_LOCALES = 'localeFilters.addAll(listOf("zh", "zh-rCN"))'

          def step_locale_filter():
              p = os.path.join("app", "build.gradle.kts")
              if not os.path.isfile(p):
                  skip("没有 app/build.gradle.kts，跳过语言过滤")
                  return
              s = read(p)

              # ---- 先擦掉已有的 localeFilters（可能是上次写的或上游自带的），保证可更新 ----
              out, skipping = [], False
              for line in s.splitlines(True):
                  if skipping:
                      if line.rstrip().endswith((")", "}", "]")):
                          skipping = False
                      continue
                  if re.match(r'^[ \t]*localeFilters\b', line):
                      if not line.rstrip().endswith((")", "}", "]")):
                          skipping = True
                      continue
                  out.append(line)
              s = "".join(out)

              # ---- 写进 androidResources 块（没有就新建）----
              pat = re.compile(r"(androidResources \{\n(?:[ \t]*.*\n)*?)([ \t]*)\}")
              m = pat.search(s)
              if m:
                  closers = m.group(2) if m.group(2) else "    "
                  indent = closers + "    "   # 块内语句比闭合括号多一级缩进
                  s = s[:m.start()] + m.group(1) + \
                      "%s%s\n%s}" % (indent, WANT_LOCALES, closers) + s[m.end():]
              else:
                  m2 = re.search(r'^android \{\n', s, re.M)
                  if not m2:
                      die("build.gradle.kts 里既找不到 androidResources 块，也找不到 android 块")
                  s = s[:m2.end()] + \
                      "    androidResources {\n        %s\n    }\n" % WANT_LOCALES + s[m2.end():]

              write(p, s)
              done("build.gradle.kts -> %s（剔除繁体与三方库多语言）" % WANT_LOCALES)


          # ----------------------------------------------------------------------------

          def main():
              print("=" * 68)
              print(" APatch 定制：中文-only + 文案覆盖 + 语言过滤")
              print("=" * 68)
              step_chinese_only()
              step_locale_filter()
              print("=" * 68)
              print(" 全部完成 ✅")
              print("=" * 68)


          if __name__ == "__main__":
              main()
          PYEOF

      # ---------------------------------------------------------------
      # STEP-2（可选）改包名
      # ---------------------------------------------------------------
      - name: 'STEP-2 修改管理器包名'
        if: ${{ inputs.package_name != '' }}
        env:
          NEW_PACKAGE: ${{ inputs.package_name }}
        run: |
          set -euo pipefail
          OLD="me.bmax.apatch"
          NEW="$NEW_PACKAGE"
          OLD_S="me/bmax/apatch"                       # apjni.cpp 里的 JNI 类路径
          NEW_S="$(echo "$NEW" | tr '.' '/')"
          echo "重命名 $OLD -> $NEW"

          FILES=$(grep -rl "$OLD" \
            --include='*.kt' --include='*.java' --include='*.xml' --include='*.kts' \
            --include='*.rs' --include='*.pro' --include='*.aidl' \
            --include='*.cpp' --include='*.h' . || true)
          echo "$FILES"
          [ -n "$FILES" ] && echo "$FILES" | xargs -r sed -i \
            -e "s|$OLD|$NEW|g" -e "s|$OLD_S|$NEW_S|g"

          # 源码 / AIDL 目录跟 package 路径保持一致
          for base in app/src/main/java app/src/main/aidl; do
            OLD_DIR="$base/$(echo $OLD | tr '.' '/')"
            NEW_DIR="$base/$(echo $NEW | tr '.' '/')"
            if [ -d "$OLD_DIR" ]; then
              mkdir -p "$(dirname "$NEW_DIR")"
              mv "$OLD_DIR" "$NEW_DIR"
            fi
          done

          echo "--- 残留检查（应为空）---"
          grep -rn "$OLD" --include='*.kt' --include='*.java' --include='*.xml' \
                          --include='*.kts' --include='*.rs' --include='*.aidl' \
                          --include='*.cpp' --include='*.h' . || echo "无残留 ✅"
          grep -n "namespace" app/build.gradle.kts

      # ---------------------------------------------------------------
      # STEP-3 精简语言列表：保留「跟随系统」入口，只留「中文」
      #     注意：Settings.kt 的 LanguageDialog 把 index == 0 硬编码为「跟随系统」
      #     （走 LocaleListCompat.getEmptyLocaleList()），所以第 0 项不能删，
      #     否则「中文」会变成 index 0，点了反而切回跟随系统，永远选不中。
      #     纯改资源文件、不碰 Kotlin，零编译风险
      #     幂等：重复执行会安全跳过
      # ---------------------------------------------------------------
      - name: 'STEP-3 精简语言列表'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, re, sys, glob, os

          def find():
              p = os.path.join("app", "src", "main", "res", "values", "arrays.xml")
              if os.path.isfile(p):
                  try:
                      if "languages_values" in io.open(p, encoding="utf-8").read():
                          return p
                  except Exception:
                      pass
              hits = []
              for q in glob.glob("app/src/main/res/**/*.xml", recursive=True):
                  try:
                      if "languages_values" in io.open(q, encoding="utf-8").read():
                          hits.append(q)
                  except Exception:
                      pass
              if not hits:
                  sys.exit("[slim-lang] 失败：全仓找不到 languages_values，上游结构可能已变化")
              return hits[0]

          path = find()
          print("[slim-lang] 目标文件: %s" % path)

          src = io.open(path, encoding="utf-8").read()

          WANT_LANG = ('    <string-array name="languages">\n'
                       '        <item>@string/system_default</item>\n'
                       '        <item>中文</item>\n'
                       '    </string-array>')
          WANT_VAL = ('    <string-array name="languages_values">\n'
                      '        <item>default</item>\n'
                      '        <item>zh-CN</item>\n'
                      '    </string-array>')

          if WANT_LANG in src and WANT_VAL in src:
              print("[slim-lang] 已处理过，跳过")
              sys.exit(0)

          pat_l = re.compile(r'[ \t]*<string-array name="languages">.*?</string-array>', re.S)
          pat_v = re.compile(r'[ \t]*<string-array name="languages_values">.*?</string-array>', re.S)

          if not pat_l.search(src) or not pat_v.search(src):
              sys.exit("[slim-lang] 失败：未匹配到 languages / languages_values，上游结构可能已变化")

          src = pat_l.sub(lambda m: WANT_LANG, src, count=1)
          src = pat_v.sub(lambda m: WANT_VAL, src, count=1)
          io.open(path, "w", encoding="utf-8", newline="\n").write(src)

          new = io.open(path, encoding="utf-8").read()
          a = re.findall(r'<string-array name="languages">(.*?)</string-array>', new, re.S)
          b = re.findall(r'<string-array name="languages_values">(.*?)</string-array>', new, re.S)
          if len(a) != 1 or len(b) != 1:
              sys.exit("[slim-lang] 失败：替换后数组数量异常")
          na, nb = a[0].count("<item>"), b[0].count("<item>")
          if na != 2 or nb != 2:
              sys.exit("[slim-lang] 失败：数组长度不为 2（%d/%d），两个数组必须等长" % (na, nb))
          print("[slim-lang] ✅ 语言列表已精简：languages=%d 项，languages_values=%d 项" % (na, nb))
          PY

      # ---------------------------------------------------------------
      # STEP-4 编译管理器 APK
      # ---------------------------------------------------------------
      - name: 'STEP-4 编译管理器 APK'
        run: |
          echo 'org.gradle.parallel=true'          >> gradle.properties
          echo 'org.gradle.jvmargs=-Xmx4096m'      >> gradle.properties
          echo 'android.native.buildOutput=verbose' >> gradle.properties
          sed -i 's/org.gradle.configuration-cache=true//g' gradle.properties
          ./gradlew clean assembleRelease
          BT=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "build-tools 版本: $BT"
          # 两个名字都导出：sign_v2_only.sh 认 BUILD_TOOLS_VERSION，官方 CI 认 BUILD_TOOL_VERSION
          echo "BUILD_TOOL_VERSION=$BT"   >> "$GITHUB_ENV"
          echo "BUILD_TOOLS_VERSION=$BT"  >> "$GITHUB_ENV"

      - name: 重签名（仅 v2 方案）
        id: sign
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}
        run: |
          set -euo pipefail
          SIGNED=$(bash .github/scripts/sign_v2_only.sh app/build/outputs/apk/release | tail -n 1)
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"
          ls -l "$SIGNED"

      # ---------------------------------------------------------------
      # STEP-5 一致性校验：APK 证书摘要必须等于写进内核的那个
      # ---------------------------------------------------------------
      - name: 'STEP-5 校验证书摘要与 kpimg 一致'
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
          BUILD_TOOL_VERSION: ${{ env.BUILD_TOOL_VERSION }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOL_VERSION/apksigner"
          APK_DIGEST=$("$APKSIGNER" verify --print-certs "$SIGNED" \
            | grep -i 'certificate SHA-256 digest' | head -1 \
            | sed 's/.*: //' | tr -d ' ' | tr 'A-Z' 'a-z')
          echo "内核内摘要: $CERT_DIGEST"
          echo "APK 证书摘要: $APK_DIGEST"
          if [ "$APK_DIGEST" != "$CERT_DIGEST" ]; then
            echo "::error::摘要不一致，刷入后将拿不到 root，已中止"
            exit 1
          fi
          echo "✅ 摘要一致"

      # ---------------------------------------------------------------
      # STEP-6 校验成品 APK：无繁体资源 + 中文文案生效
      # ---------------------------------------------------------------
      - name: 'STEP-6 校验成品 APK（无繁体 / 文案生效）'
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
          BUILD_TOOL_VERSION: ${{ env.BUILD_TOOL_VERSION }}
        run: |
          set -euo pipefail
          AAPT2="$ANDROID_HOME/build-tools/$BUILD_TOOL_VERSION/aapt2"

          echo "--- 6.1 APK 内 locale 列表 ---"
          LOCALES=$("$AAPT2" dump badging "$SIGNED" | sed -n 's/^locales: //p' || true)
          echo "locales: ${LOCALES:-<未输出>}"
          if echo "$LOCALES" | grep -qiE 'TW|HK|MO|Hant'; then
            echo "::error::仍存在繁体资源：$LOCALES"
            exit 1
          fi
          echo "✅ 无繁体资源"

          echo "--- 6.2 中文文案自检（源码侧）---"
          python3 - <<'PY'
          import io, re, sys
          src = io.open("app/src/main/res/values/strings.xml", encoding="utf-8").read()
          want = {
              "settings_check_update_summary":          "自动检测",
              "settings_sucompat_summary":              "适用于su不生效",
              "settings_night_mode_follow_sys":         "深色模式",
              "settings_use_system_color_theme":        "主题颜色",
          }
          bad = []
          for name, val in want.items():
              m = re.search(r'<string name="%s">(.*?)</string>' % name, src, re.S)
              got = m.group(1).strip() if m else None
              if got != val:
                  bad.append("%s -> %r（期望 %r）" % (name, got, val))
          if bad:
              print("\n".join(bad))
              sys.exit("::error::文案校验未通过")
          print("✅ 文案校验通过（%d 条）" % len(want))
          PY

      - name: 上传编译产物
        uses: actions/upload-artifact@v7
        with:
          name: APatch-Custom
          path: ${{ steps.sign.outputs.signed }}

      - name: 创建 Release
        if: ${{ inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-${{ github.run_number }}
          name: 自定义 APatch 构建 #${{ github.run_number }}
          files: ${{ steps.sign.outputs.signed }}
